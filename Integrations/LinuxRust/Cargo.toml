[package]
name = "codexbar-linux"
version = "0.84.0"
edition = "2021"
license = "MIT"
description = "CodexBar desktop for Linux (Rust) - tray, popover, spend dashboard, settings"

[[bin]]
name = "codexbar-linux"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced = { version = "0.13", features = ["tokio", "svg", "image", "canvas"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "fs", "sync"] }
ksni = "0.2"
tiny-skia = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-rust = "4"
dirs = "6"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
