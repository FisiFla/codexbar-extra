name: Release Linux desktop (Rust)
run-name: Linux desktop ${{ github.ref_name }}

# The macOS app releases from `v*` tags (signed/notarized). The Rust Linux desktop
# app publishes separately from `linux-v<version>` tags; manual runs build and test only.
on:
  push:
    tags: ['linux-v*']
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-linux-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Integrations/LinuxRust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Build COSMIC focus helper (GPL, separate program)
        run: cargo build --release --locked --manifest-path cosmic-focus/Cargo.toml
      - name: Package
        id: package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            version="${GITHUB_REF_NAME#linux-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          archive="$(python3 package.py --binary target/release/codexbar-linux \
            --cosmic-focus cosmic-focus/target/release/codexbar-cosmic-focus \
            --version "$version" --arch "$ARCH" --output "$RUNNER_TEMP/dist")"
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rust-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-rust-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#linux-v}"
          notes="CodexBar Extra desktop app for Linux (Rust, iced + StatusNotifierItem tray) v${version}.

          Requires the CodexBar CLI (\`codexbar\`) for data. Install:
          \`\`\`sh
          sha256sum -c CodexBarDesktop-v${version}-linux-<arch>.tar.gz.sha256
          tar -xzf CodexBarDesktop-v${version}-linux-<arch>.tar.gz
          cd CodexBarDesktop-v${version}-linux-<arch>
          python3 Integrations/LinuxRust/install.py --cli /absolute/path/to/codexbar
          \`\`\`
          See Integrations/LinuxRust/README.md. The macOS app is unchanged and keeps its own v* releases."
          gh release create "$TAG" dist/* --title "CodexBar Linux ${version}" --notes "$notes" --latest=false
